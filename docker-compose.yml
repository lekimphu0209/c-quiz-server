version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: c-quiz-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - c_quiz_db:/data
    environment:
      - PORT=5000
      - DB_PATH=/data/exam.db
    networks:
      - quiz-net

  client-gui:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: c-quiz-client-gui
    restart: unless-stopped
    ports:
      - "6080:6080"
    volumes:
      - .:/app
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=5000
      - DISPLAY=:0
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      - server
    networks:
      - quiz-net

volumes:
  c_quiz_db:
    name: c_quiz_db

networks:
  quiz-net:
    name: quiz-net
    driver: bridge
